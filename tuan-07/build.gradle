plugins {
    id 'java'
}

group = 'vn.appium.testing'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'io.appium:java-client:9.3.0'
    testImplementation 'org.testng:testng:7.10.2'
}

// Mỗi tuần là một thư mục riêng, Gradle biên dịch code của tất cả các tuần
sourceSets {
    test {
        java {
            srcDirs = ['.']
            exclude 'build/**'
        }
    }
}

// File .java lưu UTF-8 (có tiếng Việt); không khai báo thì Windows đọc nhầm bằng windows-1252
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useTestNG()
    // In kết quả từng test ra terminal để chụp ảnh minh chứng
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}